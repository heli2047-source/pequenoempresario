<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="storeTechGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- Store Roof / Awning Top Bar -->
  <rect x="24" y="20" width="52" height="6" rx="3" fill="url(#storeTechGrad)" />

  <!-- Awning (4 Scalloped Segments) -->
  <path d="
    M 25 26
    L 20 44
    C 20 50 28 50 29 44
    C 30 50 38 50 39 44
    C 40 50 48 50 49 44
    C 50 50 58 50 59 44
    C 60 50 68 50 69 44
    C 70 50 78 50 79 44
    L 75 26
    Z
  " fill="url(#storeTechGrad)" />

  <!-- Main Storefront Wall -->
  <path d="M 24 48 L 24 80 L 76 80 L 76 48 Z" fill="url(#storeTechGrad)" />

  <!-- Door (Cutout / White) -->
  <rect x="32" y="58" width="14" height="22" rx="2" fill="#FFFFFF" />

  <!-- Base Floor Bar -->
  <rect x="18" y="80" width="64" height="5" rx="2.5" fill="url(#storeTechGrad)" />

  <!-- Circuit Traces (White on building, cyan/blue outside) -->
  <!-- Top trace -->
  <line x1="56" y1="56" x2="80" y2="56" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
  <circle cx="84" cy="56" r="4.5" fill="#00D2FF" />
  <circle cx="84" cy="56" r="2" fill="#FFFFFF" />
  <circle cx="56" cy="56" r="3" fill="#FFFFFF" />

  <!-- Middle trace -->
  <path d="M 50 66 L 68 66 L 76 74 L 84 74" fill="none" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="88" cy="74" r="4.5" fill="#00D2FF" />
  <circle cx="88" cy="74" r="2" fill="#FFFFFF" />
  <circle cx="50" cy="66" r="3" fill="#FFFFFF" />

  <!-- Bottom trace -->
  <line x1="56" y1="76" x2="68" y2="76" stroke="#00D2FF" stroke-width="3" stroke-linecap="round" />
</svg>